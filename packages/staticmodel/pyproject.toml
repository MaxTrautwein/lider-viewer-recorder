[project]
name = "staticmodel"
version = "0.1.0"
description = "Per-pixel background model of a fixed Ouster lidar: which points do not move"
authors = [
    { name = "Max Trautwein", email = "46843360+MaxTrautwein@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "ouster-sdk>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
